<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Role - Proyek Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F6F7FB] text-[#1B1F3B]">
  <div class="flex min-h-screen">

    <aside class="hidden w-[232px] shrink-0 flex-col gap-1 border-r border-[#E7E9F2] bg-white px-4 py-7 md:flex">
      <div class="px-3 pb-6 text-lg font-bold text-[#3730A3]">devTask</div>
      <a href="/" class="rounded-lg px-3 py-[11px] text-sm font-medium text-[#3A3F63]">Dashboard</a>
      <a href="/task" class="rounded-lg px-3 py-[11px] text-sm font-medium text-[#3A3F63]">Task</a>
      <a href="/developer" class="rounded-lg px-3 py-[11px] text-sm font-medium text-[#3A3F63]">Developer</a>
      <a href="/role" class="rounded-lg px-3 py-[11px] text-sm bg-[#EEF0FF] font-semibold text-[#3730A3]">Role</a>
      <a href="/prioritas" class="rounded-lg px-3 py-[11px] text-sm font-medium text-[#3A3F63]">Prioritas</a>
    </aside>

    <div class="min-w-0 flex-1">
      <main class="flex flex-col gap-6 px-5 pb-28 pt-7 md:px-10 md:py-8">
        <div class="flex items-center justify-between gap-3">
          <div>
            <p class="text-xs text-[#5B6080] md:hidden">Proyek Software</p>
            <h1 class="text-[22px] font-bold md:text-[26px]">Role</h1>
            <p class="mt-1 hidden text-sm text-[#5B6080] md:block">Peran developer di dalam tim</p>
          </div>
        </div>

        <section class="flex flex-col gap-6 lg:flex-row">
          <div class="rounded-xl border border-[#E7E9F2] bg-white min-w-0 flex-1 overflow-x-auto">
              <div class="border-b border-[#E7E9F2] p-3">
                <input type="search" aria-label="Cari role" placeholder="Cari nama role..." class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
              </div>
            <table class="w-full min-w-[420px] text-left text-sm">
              <thead class="bg-[#F3F4FA] text-xs font-semibold text-[#5B6080]"><tr><th class="px-4 py-2.5">ID role</th><th class="px-4 py-2.5">Nama role</th><th class="px-4 py-2.5">Jumlah developer</th><th class="px-4 py-2.5">Aksi</th></tr></thead>
              <tbody class="divide-y divide-[#E7E9F2]">
              <tr><td class="px-4 py-3.5">1</td><td class="px-4 py-3.5">Frontend</td><td class="px-4 py-3.5">1</td><td class="px-4 py-3.5"><a href="#" class="mr-3 text-[13px] font-semibold text-[#3730A3]">Ubah</a><a href="#" class="text-[13px] font-semibold text-[#B42318]">Hapus</a></td></tr>
              <tr><td class="px-4 py-3.5">2</td><td class="px-4 py-3.5">Backend</td><td class="px-4 py-3.5">1</td><td class="px-4 py-3.5"><a href="#" class="mr-3 text-[13px] font-semibold text-[#3730A3]">Ubah</a><a href="#" class="text-[13px] font-semibold text-[#B42318]">Hapus</a></td></tr>
              <tr><td class="px-4 py-3.5">3</td><td class="px-4 py-3.5">Fullstack</td><td class="px-4 py-3.5">1</td><td class="px-4 py-3.5"><a href="#" class="mr-3 text-[13px] font-semibold text-[#3730A3]">Ubah</a><a href="#" class="text-[13px] font-semibold text-[#B42318]">Hapus</a></td></tr>
              </tbody>
            </table>
          </div>
          <aside class="rounded-xl border border-[#E7E9F2] bg-white w-full self-start p-5 lg:w-[300px]">
            <h2 class="mb-4 font-semibold">Tambah role</h2>
            <label for="nama" class="mb-1.5 block text-[13px] font-semibold">Nama role</label>
            <input id="nama" type="text" placeholder="Contoh: DevOps" class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
            <button type="button" class="mt-4 h-11 w-full rounded-lg bg-[#4F46E5] text-sm font-semibold text-white hover:opacity-90">Simpan Role</button>
          </aside>
        </section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script>
function $(selector) { return document.querySelector(selector); }

function aman(teks) {
  if (teks === undefined || teks === null) { return '-'; }
  return String(teks).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function cari(daftar, id) {
  for (var i = 0; i < daftar.length; i++) {
    if (String(daftar[i].id) === String(id)) { return daftar[i]; }
  }
  return null;
}

function buatBaris(kolom) {
  var html = '<tr>';
  for (var i = 0; i < kolom.length; i++) {
    html = html + '<td class="px-4 py-3.5">' + kolom[i] + '</td>';
  }
  return html + '</tr>';
}

function gabungBaris(daftarBaris, jumlahKolom) {
  if (daftarBaris.length === 0) {
    return '<tr><td colspan="' + jumlahKolom + '" class="px-4 py-6 text-center text-sm text-[#5B6080]">Belum ada data</td></tr>';
  }
  return daftarBaris.join('');
}

function tombolAksi(id) {
  return '<a href="#" data-aksi="ubah" data-id="' + id + '" class="mr-3 text-[13px] font-semibold text-[#3730A3]">Ubah</a>' +
         '<a href="#" data-aksi="hapus" data-id="' + id + '" class="text-[13px] font-semibold text-[#B42318]">Hapus</a>';
}

function pasangTombolAksi(fungsiUbah, fungsiHapus) {
  document.addEventListener('click', function (e) {
    var tombol = e.target.closest('[data-aksi]');
    if (tombol === null) { return; }
    e.preventDefault();
    var id = tombol.getAttribute('data-id');
    if (tombol.getAttribute('data-aksi') === 'ubah') {
      fungsiUbah(id);
    } else {
      fungsiHapus(id);
    }
  });
}

document.head.insertAdjacentHTML('beforeend', "<style>.swal2-popup{font-family:'Plus Jakarta Sans',sans-serif}</style>");

function popupSukses(judul, teks, setelahTutup) {
  Swal.fire({
    icon: 'success',
    title: judul,
    text: teks,
    timer: 1600,
    timerProgressBar: true,
    showConfirmButton: false
  }).then(function () {
    if (setelahTutup) { setelahTutup(); }
  });
}

function popupPeringatan(teks, judul) {
  return Swal.fire({
    icon: 'warning',
    title: judul || 'Perhatian',
    text: teks,
    confirmButtonText: 'Mengerti',
    confirmButtonColor: '#4F46E5'
  });
}

function popupKonfirmasi(judul, teks, untukHapus, kalauYa) {
  Swal.fire({
    icon: untukHapus ? 'warning' : 'question',
    title: judul,
    text: teks,
    showCancelButton: true,
    confirmButtonText: untukHapus ? 'Ya, hapus' : 'Ya, ubah',
    cancelButtonText: 'Batal',
    confirmButtonColor: untukHapus ? '#B42318' : '#4F46E5',
    cancelButtonColor: '#8A90AD',
    reverseButtons: true
  }).then(function (hasil) {
    if (hasil.isConfirmed) { kalauYa(); }
  });
}

var input = $('#nama');
var tombolSimpan = $('aside button');
var judulForm = $('aside h2');
var judulAwal = judulForm.textContent;
var teksTombolAwal = tombolSimpan.textContent;
var idSedangDiubah = null;
var tombolBatal = null;
var daftarRole = [];

async function muatData() {
  try {
    daftarRole = await panggilApi('/role');
    tampilkan();
  } catch (error) {
    $('tbody').innerHTML = gabungBaris([], 4);
    popupPeringatan(error.message, 'Gagal memuat data');
  }
}

var kolomCari = $('[aria-label="Cari role"]');

function tampilkan() {
  var kataKunci = kolomCari.value.trim().toLowerCase();
  var baris = [];
  for (var i = 0; i < daftarRole.length; i++) {
    var r = daftarRole[i];
    if ((r.nama + ' ' + r.id).toLowerCase().indexOf(kataKunci) !== -1) {
      baris.push(buatBaris([r.id, aman(r.nama), r.jumlahDeveloper, tombolAksi(r.id)]));
    }
  }
  $('tbody').innerHTML = gabungBaris(baris, 4);
}
kolomCari.addEventListener('input', tampilkan);

function resetForm() {
  idSedangDiubah = null;
  input.value = '';
  judulForm.textContent = judulAwal;
  tombolSimpan.textContent = teksTombolAwal;
  if (tombolBatal !== null) {
    tombolBatal.remove();
    tombolBatal = null;
  }
}

function mulaiUbah(id) {
  idSedangDiubah = id;
  input.value = cari(daftarRole, id).nama;
  judulForm.textContent = 'Ubah role';
  tombolSimpan.textContent = 'Simpan Perubahan';
  if (tombolBatal === null) {
    tombolBatal = document.createElement('button');
    tombolBatal.type = 'button';
    tombolBatal.className = 'mt-2 h-11 w-full rounded-lg border border-[#8A90AD] bg-white text-sm font-semibold text-[#1B1F3B]';
    tombolBatal.textContent = 'Batal';
    tombolBatal.addEventListener('click', resetForm);
    tombolSimpan.after(tombolBatal);
  }
  input.focus();
}

async function simpanRole() {
  if (tombolSimpan.disabled) { return; }

  var nama = input.value.trim();
  if (nama === '') {
    popupPeringatan('Nama role wajib diisi.', 'Data belum lengkap');
    return;
  }

  tombolSimpan.disabled = true;
  try {
    var pesan;
    if (idSedangDiubah !== null) {
      await panggilApi('/role/' + idSedangDiubah, 'PUT', { nama: nama });
      pesan = 'Role berhasil diubah!';
    } else {
      await panggilApi('/role', 'POST', { nama: nama });
      pesan = 'Role berhasil disimpan!';
    }
    resetForm();
    await muatData();
    popupSukses(pesan, nama);
  } catch (error) {
    popupPeringatan(error.message, 'Role gagal disimpan');
  } finally {
    tombolSimpan.disabled = false;
  }
}

function ubahRole(id) {
  var r = cari(daftarRole, id);
  popupKonfirmasi('Apakah anda yakin untuk mengubah role ini?', r.nama, false, function () {
    mulaiUbah(r.id);
  });
}

function hapusRole(id) {
  var r = cari(daftarRole, id);
  if (r.jumlahDeveloper > 0) {
    popupPeringatan('Role "' + r.nama + '" masih dipakai ' + r.jumlahDeveloper + ' developer. Ubah atau hapus developer-nya dulu.', 'Role tidak bisa dihapus');
    return;
  }
  popupKonfirmasi('Apakah anda yakin untuk menghapus role ini?', r.nama, true, async function () {
    try {
      await panggilApi('/role/' + r.id, 'DELETE');
      resetForm();
      await muatData();
      popupSukses('Role berhasil dihapus!', r.nama);
    } catch (error) {
      popupPeringatan(error.message, 'Role gagal dihapus');
    }
  });
}

tombolSimpan.addEventListener('click', simpanRole);
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); simpanRole(); }
});
pasangTombolAksi(ubahRole, hapusRole);
muatData();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Proyek Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F6F7FB] text-[#1B1F3B]">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <div class="w-full max-w-[400px]">

      <div class="mb-6 text-center">
        <div class="text-2xl font-bold text-[#3730A3]">devTask</div>
        <p class="mt-1 text-sm text-[#5B6080]">Masuk untuk mengelola task tim software</p>
      </div>

      <form id="formLogin" class="rounded-xl border border-[#E7E9F2] bg-white p-7" onsubmit="return false">
        <h1 class="mb-5 text-xl font-bold">Masuk</h1>

        <label for="username" class="mb-1.5 block text-[13px] font-semibold">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Masukkan username"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">

        <label for="password" class="mb-1.5 mt-4 block text-[13px] font-semibold">Password</label>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password"
            class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white pl-3 pr-16 text-sm text-[#1B1F3B]">
          <button id="tombolLihat" type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs font-semibold text-[#3730A3]">Lihat</button>
        </div>
        <div class="mt-2 text-right">
            <a href="/lupa-password" class="text-xs font-semibold text-[#3730A3]">Lupa password?</a>
        </div>

        <button id="tombolMasuk" type="submit"
          class="mt-6 h-11 w-full rounded-lg bg-[#4F46E5] text-sm font-semibold text-white hover:opacity-90">Masuk</button>
      </form>

      <p class="mt-4 text-center text-sm text-[#5B6080]">Belum punya akun? <a href="/register" class="font-semibold text-[#3730A3]">Daftar</a></p>
    </div>
  </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="api.js"></script>
    <script>
function $(selector) { return document.querySelector(selector); }

document.head.insertAdjacentHTML('beforeend', "<style>.swal2-popup{font-family:'Plus Jakarta Sans',sans-serif}</style>");

function popupPeringatan(teks, judul) {
  return Swal.fire({
    icon: 'warning',
    title: judul || 'Perhatian',
    text: teks,
    confirmButtonText: 'Mengerti',
    confirmButtonColor: '#4F46E5'
  });
}

var form = $('#formLogin');
var kolomUsername = $('#username');
var kolomPassword = $('#password');
var tombolLihat = $('#tombolLihat');
var tombolMasuk = $('#tombolMasuk');

tombolLihat.addEventListener('click', function () {
  if (kolomPassword.type === 'password') {
    kolomPassword.type = 'text';
    tombolLihat.textContent = 'Sembunyikan';
  } else {
    kolomPassword.type = 'password';
    tombolLihat.textContent = 'Lihat';
  }
  kolomPassword.focus();
});

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  if (tombolMasuk.disabled) { return; }

  var username = kolomUsername.value.trim();
  var password = kolomPassword.value;

  if (username === '') {
    popupPeringatan('Username wajib diisi.', 'Data belum lengkap').then(function () { kolomUsername.focus(); });
    return;
  }
  if (password === '') {
    popupPeringatan('Password wajib diisi.', 'Data belum lengkap').then(function () { kolomPassword.focus(); });
    return;
  }

  tombolMasuk.disabled = true;
  tombolMasuk.textContent = 'Memproses...';
  try {
    await panggilApi('/login', 'POST', { username: username, password: password });
    window.location.href = '/';
  } catch (error) {
    popupPeringatan(error.message, 'Gagal masuk').then(function () {
      kolomPassword.value = '';
      kolomPassword.focus();
    });
    tombolMasuk.disabled = false;
    tombolMasuk.textContent = 'Masuk';
  }
});

kolomUsername.focus();
  </script>
</body>
</html>

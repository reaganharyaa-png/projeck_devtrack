<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Proyek Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F6F7FB] text-[#1B1F3B]">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <div class="w-full max-w-[400px]">

      <div class="mb-6 text-center">
        <div class="text-2xl font-bold text-[#3730A3]">devTask</div>
        <p class="mt-1 text-sm text-[#5B6080]">Atur ulang password akunmu</p>
      </div>

      <form id="formLupa" class="rounded-xl border border-[#E7E9F2] bg-white p-7">
        <h1 class="mb-5 text-xl font-bold">Lupa password</h1>

        <label for="username" class="mb-1.5 block text-[13px] font-semibold">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Masukkan username"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">

        <div id="tahap2" class="hidden">
          <div class="mt-4 rounded-lg bg-[#F3F4FA] p-3">
            <p class="text-xs text-[#5B6080]">Pertanyaan keamanan</p>
            <p id="teksPertanyaan" class="mt-1 text-sm font-semibold"></p>
          </div>

          <label for="jawaban" class="mb-1.5 mt-4 block text-[13px] font-semibold">Jawaban</label>
          <input id="jawaban" type="text" autocomplete="off" placeholder="Jawabanmu"
            class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">

          <label for="password" class="mb-1.5 mt-4 block text-[13px] font-semibold">Password baru</label>
          <div class="relative">
            <input id="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"
              class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white pl-3 pr-16 text-sm text-[#1B1F3B]">
            <button id="tombolLihat" type="button"
              class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs font-semibold text-[#3730A3]">Lihat</button>
          </div>

          <label for="password2" class="mb-1.5 mt-4 block text-[13px] font-semibold">Ulangi password baru</label>
          <input id="password2" type="password" autocomplete="new-password" placeholder="Ketik ulang password baru"
            class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
        </div>

        <button id="tombolKirim" type="submit"
          class="mt-6 h-11 w-full rounded-lg bg-[#4F46E5] text-sm font-semibold text-white hover:opacity-90">Lanjut</button>
        <button id="tombolUlang" type="button"
          class="mt-2 hidden h-11 w-full rounded-lg border border-[#8A90AD] bg-white text-sm font-semibold text-[#1B1F3B]">Ganti username</button>
      </form>

      <p class="mt-4 text-center text-sm text-[#5B6080]">Ingat password? <a href="" class="font-semibold text-[#3730A3]">Masuk</a></p>
      <p class="mt-2 text-center text-xs text-[#5B6080]">Akun lama tanpa pertanyaan keamanan: minta admin mereset passwordmu.</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="api.js"></script>
  <script>
function $(selector) { return document.querySelector(selector); }

document.head.insertAdjacentHTML('beforeend', "<style>.swal2-popup{font-family:'Plus Jakarta Sans',sans-serif}</style>");

function popupPeringatan(teks, judul) {
  return Swal.fire({
    icon: 'warning',
    title: judul || 'Perhatian',
    text: teks,
    confirmButtonText: 'Mengerti',
    confirmButtonColor: '#4F46E5'
  });
}

function peringatanForm(pesan, selector) {
  popupPeringatan(pesan, 'Data belum lengkap').then(function () { $(selector).focus(); });
}

var form = $('#formLupa');
var kolomUsername = $('#username');
var tahap2 = $('#tahap2');
var tombolKirim = $('#tombolKirim');
var tombolUlang = $('#tombolUlang');
var tombolLihat = $('#tombolLihat');
var kolomPassword = $('#password');
var kolomPassword2 = $('#password2');
var sedangTahap2 = false;

function keTahap1() {
  sedangTahap2 = false;
  tahap2.classList.add('hidden');
  tombolUlang.classList.add('hidden');
  kolomUsername.readOnly = false;
  kolomUsername.classList.remove('bg-[#F3F4FA]');
  $('#jawaban').value = '';
  kolomPassword.value = '';
  kolomPassword2.value = '';
  tombolKirim.textContent = 'Lanjut';
  kolomUsername.focus();
}

function keTahap2(pertanyaan) {
  sedangTahap2 = true;
  $('#teksPertanyaan').textContent = pertanyaan;
  tahap2.classList.remove('hidden');
  tombolUlang.classList.remove('hidden');
  kolomUsername.readOnly = true;
  kolomUsername.classList.add('bg-[#F3F4FA]');
  tombolKirim.textContent = 'Ubah Password';
  $('#jawaban').focus();
}

tombolUlang.addEventListener('click', keTahap1);

tombolLihat.addEventListener('click', function () {
  var tampil = kolomPassword.type === 'password';
  kolomPassword.type = tampil ? 'text' : 'password';
  kolomPassword2.type = tampil ? 'text' : 'password';
  tombolLihat.textContent = tampil ? 'Sembunyikan' : 'Lihat';
});

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  if (tombolKirim.disabled) { return; }

  var username = kolomUsername.value.trim();
  if (username === '') { peringatanForm('Username wajib diisi.', '#username'); return; }

  if (!sedangTahap2) {
    tombolKirim.disabled = true;
    tombolKirim.textContent = 'Memproses...';
    try {
      var hasil = await panggilApi('/lupa/pertanyaan', 'POST', { username: username });
      keTahap2(hasil.pertanyaan);
    } catch (error) {
      popupPeringatan(error.message, 'Gagal');
      tombolKirim.textContent = 'Lanjut';
    }
    tombolKirim.disabled = false;
    return;
  }

  var jawaban = $('#jawaban').value.trim();
  var password = kolomPassword.value;
  var password2 = kolomPassword2.value;

  if (jawaban === '') { peringatanForm('Jawaban wajib diisi.', '#jawaban'); return; }
  if (password.length < 6) { peringatanForm('Password baru minimal 6 karakter.', '#password'); return; }
  if (password !== password2) { peringatanForm('Ulangi password tidak sama dengan password baru.', '#password2'); return; }

  tombolKirim.disabled = true;
  tombolKirim.textContent = 'Memproses...';
  try {
    await panggilApi('/lupa/reset', 'POST', { username: username, jawaban: jawaban, passwordBaru: password });
    await Swal.fire({
      icon: 'success',
      title: 'Password berhasil diubah!',
      text: 'Silakan masuk dengan password baru.',
      timer: 1800,
      timerProgressBar: true,
      showConfirmButton: false
    });
    window.location.href = '/login';
  } catch (error) {
    popupPeringatan(error.message, 'Gagal mengubah password');
    tombolKirim.disabled = false;
    tombolKirim.textContent = 'Ubah Password';
  }
});

kolomUsername.focus();
  </script>
</body>
</html>

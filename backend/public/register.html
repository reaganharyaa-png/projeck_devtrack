<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Proyek Software</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#F6F7FB] text-[#1B1F3B]">
  <main class="flex min-h-screen items-center justify-center px-5 py-10">
    <div class="w-full max-w-[420px]">

      <div class="mb-6 text-center">
        <div class="text-2xl font-bold text-[#3730A3]">devTask</div>
        <p class="mt-1 text-sm text-[#5B6080]">Buat akun untuk mengelola task tim software</p>
      </div>

      <form id="formDaftar" class="rounded-xl border border-[#E7E9F2] bg-white p-7">
        <h1 class="mb-5 text-xl font-bold">Daftar</h1>

        <label for="nama" class="mb-1.5 block text-[13px] font-semibold">Nama lengkap</label>
        <input id="nama" type="text" autocomplete="name" placeholder="Contoh: Budi Santoso"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">

        <label for="username" class="mb-1.5 mt-4 block text-[13px] font-semibold">Username</label>
        <input id="username" type="text" autocomplete="username" placeholder="Contoh: budi.santoso"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
        <p class="mt-1.5 text-xs text-[#5B6080]">3 sampai 30 karakter: huruf, angka, titik, garis bawah.</p>

        <label for="password" class="mb-1.5 mt-4 block text-[13px] font-semibold">Password</label>
        <div class="relative">
          <input id="password" type="password" autocomplete="new-password" placeholder="Minimal 6 karakter"
            class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white pl-3 pr-16 text-sm text-[#1B1F3B]">
          <button id="tombolLihat" type="button"
            class="absolute right-2 top-1/2 -translate-y-1/2 rounded px-2 py-1 text-xs font-semibold text-[#3730A3]">Lihat</button>
        </div>

        <label for="password2" class="mb-1.5 mt-4 block text-[13px] font-semibold">Ulangi password</label>
        <input id="password2" type="password" autocomplete="new-password" placeholder="Ketik ulang password"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">

        <label for="pertanyaan" class="mb-1.5 mt-4 block text-[13px] font-semibold">Pertanyaan keamanan</label>
        <select id="pertanyaan" class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
          <option value="">Memuat...</option>
        </select>

        <label for="jawaban" class="mb-1.5 mt-4 block text-[13px] font-semibold">Jawaban</label>
        <input id="jawaban" type="text" autocomplete="off" placeholder="Jawabanmu"
          class="h-11 w-full rounded-lg border border-[#8A90AD] bg-white px-3 text-sm text-[#1B1F3B]">
        <p class="mt-1.5 text-xs text-[#5B6080]">Dipakai untuk mereset password jika kamu lupa. Ingat jawabannya.</p>

        <button id="tombolDaftar" type="submit"
          class="mt-6 h-11 w-full rounded-lg bg-[#4F46E5] text-sm font-semibold text-white hover:opacity-90">Daftar</button>
      </form>

      <p class="mt-4 text-center text-sm text-[#5B6080]">Sudah punya akun? <a href="/login" class="font-semibold text-[#3730A3]">Masuk</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.8/dist/sweetalert2.all.min.js"></script>
  <script src="api.js"></script>
  <script>
function $(selector) { return document.querySelector(selector); }

function aman(teks) {
  return String(teks).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.head.insertAdjacentHTML('beforeend', "<style>.swal2-popup{font-family:'Plus Jakarta Sans',sans-serif}</style>");

function popupPeringatan(teks, judul) {
  return Swal.fire({
    icon: 'warning',
    title: judul || 'Perhatian',
    text: teks,
    confirmButtonText: 'Mengerti',
    confirmButtonColor: '#4F46E5'
  });
}

function peringatanForm(pesan, selector) {
  popupPeringatan(pesan, 'Data belum lengkap').then(function () { $(selector).focus(); });
}

var form = $('#formDaftar');
var tombolDaftar = $('#tombolDaftar');
var tombolLihat = $('#tombolLihat');
var kolomPassword = $('#password');
var kolomPassword2 = $('#password2');

async function muatPertanyaan() {
  try {
    var daftar = await panggilApi('/pertanyaan');
    var html = '<option value="">Pilih pertanyaan...</option>';
    for (var i = 0; i < daftar.length; i++) {
      html += '<option value="' + aman(daftar[i]) + '">' + aman(daftar[i]) + '</option>';
    }
    $('#pertanyaan').innerHTML = html;
  } catch (error) {
    $('#pertanyaan').innerHTML = '<option value="">Gagal memuat</option>';
    popupPeringatan(error.message, 'Gagal memuat pertanyaan');
  }
}

tombolLihat.addEventListener('click', function () {
  var tampil = kolomPassword.type === 'password';
  kolomPassword.type = tampil ? 'text' : 'password';
  kolomPassword2.type = tampil ? 'text' : 'password';
  tombolLihat.textContent = tampil ? 'Sembunyikan' : 'Lihat';
});

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  if (tombolDaftar.disabled) { return; }

  var nama = $('#nama').value.trim();
  var username = $('#username').value.trim();
  var password = kolomPassword.value;
  var password2 = kolomPassword2.value;
  var pertanyaan = $('#pertanyaan').value;
  var jawaban = $('#jawaban').value.trim();

  if (nama === '') { peringatanForm('Nama lengkap wajib diisi.', '#nama'); return; }
  if (!/^[A-Za-z0-9._]{3,30}$/.test(username)) {
    peringatanForm('Username 3 sampai 30 karakter, hanya huruf, angka, titik, dan garis bawah.', '#username');
    return;
  }
  if (password.length < 6) { peringatanForm('Password minimal 6 karakter.', '#password'); return; }
  if (password !== password2) { peringatanForm('Ulangi password tidak sama dengan password.', '#password2'); return; }
  if (pertanyaan === '') { peringatanForm('Pilih pertanyaan keamanan.', '#pertanyaan'); return; }
  if (jawaban === '') { peringatanForm('Jawaban keamanan wajib diisi.', '#jawaban'); return; }

  tombolDaftar.disabled = true;
  tombolDaftar.textContent = 'Memproses...';
  try {
    await panggilApi('/register', 'POST', {
      nama: nama,
      username: username,
      password: password,
      pertanyaan: pertanyaan,
      jawaban: jawaban
    });
    await Swal.fire({
      icon: 'success',
      title: 'Akun berhasil dibuat!',
      text: 'Silakan masuk dengan username ' + username + '.',
      timer: 1800,
      timerProgressBar: true,
      showConfirmButton: false
    });
    window.location.href = '/login';
  } catch (error) {
    popupPeringatan(error.message, 'Gagal mendaftar');
    tombolDaftar.disabled = false;
    tombolDaftar.textContent = 'Daftar';
  }
});

muatPertanyaan();
$('#nama').focus();
  </script>
</body>
</html>
